<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mistral AI Chatbot</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f1f5f9;
      font-family: Arial, sans-serif;
    }

    .chat-container {
      width: 100%;
      max-width: 700px;
      height: 90vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: white;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.12);
    }

    .chat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      color: white;
      background: #111827;
    }

    .chat-header h1 {
      font-size: 20px;
    }

    .new-chat-btn {
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      color: #111827;
      background: white;
      cursor: pointer;
    }

    .new-chat-btn:hover {
      background: #e5e7eb;
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      background: #f8fafc;
    }

    .message {
      max-width: 80%;
      margin-bottom: 16px;
      padding: 12px 15px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .message.user {
      margin-left: auto;
      color: white;
      background: #2563eb;
      border-bottom-right-radius: 3px;
    }

    .message.bot {
      margin-right: auto;
      color: #111827;
      background: #e5e7eb;
      border-bottom-left-radius: 3px;
    }

    .message.error {
      margin-right: auto;
      color: #991b1b;
      background: #fee2e2;
    }

    .typing {
      display: none;
      padding: 0 20px 12px;
      color: #64748b;
      font-size: 14px;
      background: #f8fafc;
    }

    .input-area {
      display: flex;
      gap: 10px;
      padding: 15px;
      border-top: 1px solid #e5e7eb;
      background: white;
    }

    #messageInput {
      flex: 1;
      resize: none;
      height: 48px;
      padding: 13px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      outline: none;
      font: inherit;
    }

    #messageInput:focus {
      border-color: #2563eb;
    }

    #sendButton {
      width: 90px;
      border: none;
      border-radius: 10px;
      color: white;
      background: #2563eb;
      cursor: pointer;
      font-weight: bold;
    }

    #sendButton:hover {
      background: #1d4ed8;
    }

    #sendButton:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    @media (max-width: 600px) {
      body {
        align-items: stretch;
      }

      .chat-container {
        height: 100vh;
        border-radius: 0;
      }

      .message {
        max-width: 90%;
      }
    }
  </style>
</head>

<body>
  <div class="chat-container">
    <header class="chat-header">
      <h1>Mistral AI Chatbot</h1>
      <button class="new-chat-btn" id="newChatButton">
        New Chat
      </button>
    </header>

    <main class="messages" id="messages">
      <div class="message bot">
        Hello! How can I help you today?
      </div>
    </main>

    <div class="typing" id="typing">
      AI is typing...
    </div>

    <form class="input-area" id="chatForm">
      <textarea
        id="messageInput"
        placeholder="Type your message..."
        required
      ></textarea>

      <button type="submit" id="sendButton">
        Send
      </button>
    </form>
  </div>

  <script>
    const API_URL = "http://localhost:7700/chat";

    const messagesContainer = document.getElementById("messages");
    const chatForm = document.getElementById("chatForm");
    const messageInput = document.getElementById("messageInput");
    const sendButton = document.getElementById("sendButton");
    const typingIndicator = document.getElementById("typing");
    const newChatButton = document.getElementById("newChatButton");

    let conversationId = localStorage.getItem("conversationId");

    if (!conversationId) {
      conversationId = crypto.randomUUID();
      localStorage.setItem("conversationId", conversationId);
    }

    function addMessage(text, type) {
      const messageElement = document.createElement("div");

      messageElement.className = `message ${type}`;
      messageElement.textContent = text;

      messagesContainer.appendChild(messageElement);
      messagesContainer.scrollTop = messagesContainer.scrollHeight;
    }

    function setLoading(isLoading) {
      sendButton.disabled = isLoading;
      messageInput.disabled = isLoading;
      typingIndicator.style.display = isLoading ? "block" : "none";
    }

    chatForm.addEventListener("submit", async (event) => {
      event.preventDefault();

      const message = messageInput.value.trim();

      if (!message) {
        return;
      }

      addMessage(message, "user");
      messageInput.value = "";
      setLoading(true);

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message,
            conversationId
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.error || "Request failed");
        }

        addMessage(data.response, "bot");
      } catch (error) {
        addMessage(
          "Sorry, something went wrong: " + error.message,
          "error"
        );
      } finally {
        setLoading(false);
        messageInput.focus();
      }
    });

    messageInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        chatForm.requestSubmit();
      }
    });

    newChatButton.addEventListener("click", () => {
      conversationId = crypto.randomUUID();
      localStorage.setItem("conversationId", conversationId);

      messagesContainer.innerHTML = `
        <div class="message bot">
          New conversation started. How can I help?
        </div>
      `;

      messageInput.focus();
    });
  </script>
</body>
</html>
